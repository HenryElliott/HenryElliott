name: Generate README Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create profile folder
        run: mkdir -p profile

      - name: Generate GitHub stats card
        run: |
          curl -L \
            "https://readme-stats-fast.vercel.app/api?username=HenryElliott&show_icons=true&theme=radical" \
            -o profile/stats.svg

      - name: Generate top languages card
        run: |
          curl -L \
            "https://readme-stats-fast.vercel.app/api/top-langs/?username=HenryElliott&layout=compact&theme=radical" \
            -o profile/top-langs.svg

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update README cards"
          git pull --rebase origin main
          git push origin main
